# ClaudeBox: isolated distro for the unattended Claude service.
# No Windows drives or PATH, boots straight into hardening.
# Interop stays "enabled" on purpose: WSL distros share one kernel, so turning
# it off here unregisters it for every distro. harden.sh blocks the box user
# from the interop channel instead.
[boot]
command=/usr/local/sbin/claudebox-harden
[automount]
enabled=false
mountFsTab=false
[interop]
appendWindowsPath=false
[network]
hostname=claudebox
[user]
default=claude
